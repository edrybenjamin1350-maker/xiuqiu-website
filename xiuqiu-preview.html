<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>壮族绣球 · 八瓣文化长卷 · 滚动交互预览</title>
<style>
    :root{
        --rose:#D82880;
        --gold:#D4AF37;
        --red:#FF3A3A;
        --yellow:#FFD02F;
        --cyan:#00C2D1;
        --tassel:#C41E70;
        --blue:#00A8BB;
        --pearl:#FFF8F8;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:auto}
    body{
        font-family:'Noto Serif SC','PingFang SC','Microsoft YaHei','STKaiti',serif;
        background:#120a10;
        color:#f3e9e6;
        overflow-x:hidden;
    }
    .font-calligraphy{font-family:'STKaiti','KaiTi','Kaiti SC','KaiTi_GB2312',serif}
    .ic{width:1em;height:1em;display:inline-block;vertical-align:-0.125em}
    .bg-pattern{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;opacity:.10}
    .brand-row{display:flex;align-items:center;gap:12px}
    .brand-badge{width:40px;height:40px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;box-shadow:0 8px 18px rgba(0,0,0,.45)}
    .brand-title{font-size:clamp(18px,1.6vw,24px);color:#fdeecb;letter-spacing:.08em}
    .brand-sub{font-size:11px;color:rgba(243,224,160,.5);letter-spacing:.3em;margin-top:2px}
    .mobile-title{font-size:18px;color:#fdeecb}
    @media (min-width:768px){.top-label{display:inline}}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:#160b12}
    ::-webkit-scrollbar-thumb{background:rgba(212,175,55,.35);border-radius:4px}
    ::-webkit-scrollbar-thumb:hover{background:rgba(212,175,55,.7)}

    /* ---------- 背景 ---------- */
    #bg{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;pointer-events:none}
    #bg .vignette{
        position:absolute;top:0;right:0;bottom:0;left:0;
        background:
            radial-gradient(ellipse at 50% 40%, rgba(216,40,128,.14), transparent 58%),
            radial-gradient(ellipse at 50% 115%, rgba(0,168,187,.12), transparent 52%),
            linear-gradient(180deg,#190c14,#120a10 50%,#0d070c);
    }
    #bg .grain{
        position:absolute;top:0;right:0;bottom:0;left:0;opacity:.55;mix-blend-mode:overlay;
        background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px),
            repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);
    }

    /* ---------- 长卷章节 ---------- */
    #sections{position:relative;z-index:10}
    .sec{position:relative;height:100vh;pointer-events:none}
    .sec .num{
        position:absolute;left:4vw;top:50%;transform:translateY(-50%);
        font-size:clamp(130px,24vh,280px);font-weight:700;line-height:1;
        color:transparent;-webkit-text-stroke:1px rgba(212,175,55,.16);
        font-family:'Ma Shan Zheng',cursive;user-select:none;
    }
    .sec .label{
        position:absolute;left:calc(4vw + 96px);top:50%;transform:translateY(-50%);
        writing-mode:vertical-rl;letter-spacing:.45em;color:rgba(243,233,230,.3);
        font-size:13px;text-transform:uppercase;user-select:none;
    }

    /* ---------- 3D 舞台 ---------- */
    #stage{
        position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;display:flex;align-items:center;justify-content:center;
        pointer-events:none;perspective:1200px;
    }
    #ballWrap{transform-style:preserve-3d}
    #ball{
        position:relative;width:300px;height:300px;transform-style:preserve-3d;
        will-change:transform;
    }
    .petal{
        position:absolute;left:50%;top:50%;width:0;height:0;
        transform-style:preserve-3d;
    }
    .seg{
        position:absolute;left:50%;top:50%;width:122px;height:123px;
        margin-left:-61px;margin-top:-61.5px;
        transform-style:preserve-3d;filter:brightness(var(--b,1));
        transition:filter .25s ease;
    }
    .petal.active .seg{
        filter:brightness(calc(var(--b,1) * 1.18)) saturate(1.16);
    }
    .seg svg{display:block;width:100%;height:100%;overflow:visible}
    .seg .seg-body{fill:#D92B20}
    .seg .seg-sheen{fill:url(#segSheen)}
    .seg .seg-side{stroke:#EFC53D;stroke-width:2.4;fill:none;stroke-linecap:round}
    .petal-label{fill:#FFF8F8;font-family:'STKaiti','KaiTi','Kaiti SC',serif;opacity:.95}
    .petal:not(.front) .petal-label{opacity:0}
    #glow{
        position:absolute;left:50%;top:50%;width:340px;height:340px;margin:-170px 0 0 -170px;
        border-radius:50%;pointer-events:none;opacity:0;transition:opacity .6s ease;z-index:-1;
        background:radial-gradient(circle, rgba(255,208,47,.42), rgba(216,40,128,.24) 45%, transparent 70%);
        filter:blur(8px);
    }

    .bead{
        position:absolute;border-radius:50%;
        background:radial-gradient(circle at 34% 28%, #ffffff, var(--pearl) 40%, #e7d8cf 72%, #c3ab9c);
        box-shadow:0 0 7px rgba(255,255,255,.35), inset 0 -2px 4px rgba(0,0,0,.2);
    }
    .bead-pole{width:40px;height:40px}
    .bead-eq{width:18px;height:18px}

    #tassels{position:absolute;left:50%;top:100%;width:0;height:0;z-index:6}
    .tassel-inner{
        position:absolute;left:0;top:0;transform:translateX(-50%);
        transform-origin:top center;display:flex;flex-direction:column;align-items:center;
    }
    .cap{
        width:22px;height:13px;border-radius:5px 5px 3px 3px;
        background:linear-gradient(180deg,#19c6da,#007e8e);
        box-shadow:0 1px 3px rgba(0,0,0,.4), inset 0 1px 1px rgba(255,255,255,.35);
    }
    .pendant{width:26px;height:42px;margin-top:1px;filter:drop-shadow(0 2px 5px rgba(123,108,255,.5))}
    .strands{display:flex;align-items:flex-start;margin-top:1px}
    .strand{
        width:3px;border-radius:99px;transform-origin:top center;
        background:linear-gradient(180deg,var(--tassel) 0%, rgba(196,30,112,.82) 55%, rgba(196,30,112,.12) 100%);
        animation:strandSway 1.7s ease-in-out infinite;
    }
    .strand:nth-child(1){height:112px;animation-delay:-.1s}
    .strand:nth-child(2){height:132px;animation-delay:-.6s}
    .strand:nth-child(3){height:148px;animation-delay:-1.1s}
    .strand:nth-child(4){height:126px;animation-delay:-.35s}
    .strand:nth-child(5){height:104px;animation-delay:-.85s}
    @keyframes strandSway{
        0%,100%{transform:rotate(-2.5deg)}
        50%{transform:rotate(2.5deg)}
    }
    .bead-line{position:relative;width:3px;height:148px}
    .bead-line .b{position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;width:8px;height:8px;background:radial-gradient(circle at 35% 30%, #fff, var(--pearl) 45%, #d9c7bd)}
    .bead-line .b1{top:44px}.bead-line .b2{top:76px}.bead-line .b3{top:108px}

    #rope{position:absolute;left:50%;bottom:100%;width:0;height:0;z-index:6}
    .rope-svg{position:absolute;left:-15px;bottom:-2px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}

    /* ---------- 右侧文化卡片 ---------- */
    #panel{
        position:fixed;right:3vw;top:50%;transform:translateY(-50%);z-index:40;
        width:410px;max-width:38vw;height:470px;max-height:64vh;pointer-events:none;
    }
    .panel-card{
        position:absolute;top:0;right:0;bottom:0;left:0;border-radius:18px;
        background:rgba(28,14,24,.86);
        backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
        border:1px solid rgba(212,175,55,.38);
        box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 0 40px rgba(216,40,128,.05);
        padding:26px 28px;opacity:0;transform:translateX(34px);
        transition:none;
        display:flex;flex-direction:column;pointer-events:none;
    }
    body.anim .panel-card{transition:opacity .55s ease, transform .55s ease}
    .panel-card.on{opacity:1;transform:none;pointer-events:auto}
    .panel-card .chip{
        display:inline-flex;align-items:center;gap:8px;
        font-size:12px;letter-spacing:.2em;color:var(--yellow);
        border:1px solid rgba(255,208,47,.35);background:rgba(255,208,47,.08);
        padding:5px 12px;border-radius:999px;align-self:flex-start;
    }
    .panel-card h2{
        font-size:clamp(24px,2.2vw,30px);color:#ffe9c2;margin-top:14px;
        text-shadow:0 0 18px rgba(216,40,128,.35);
    }
    .panel-card .sub{font-size:12px;color:rgba(243,233,230,.5);margin-top:4px;letter-spacing:.12em}
    .panel-card .divider{height:1px;margin:16px 0;background:linear-gradient(90deg,var(--gold),transparent)}
    .panel-card .body{
        flex:1;overflow-y:auto;font-size:14.5px;line-height:1.95;color:rgba(243,233,230,.88);
        text-align:justify;padding-right:4px;
    }
    .panel-card .body::-webkit-scrollbar{width:3px}
    .panel-card .hint{
        margin-top:14px;font-size:12.5px;color:rgba(212,175,55,.8);
        display:flex;align-items:center;gap:8px;letter-spacing:.08em;
    }
    .panel-card .hint i{animation:bob 1.6s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

    /* ---------- 顶部与底部指示 ---------- */
    #header{
        position:fixed;top:0;left:0;right:0;z-index:50;
        display:flex;justify-content:space-between;align-items:center;
        padding:18px 3vw;pointer-events:none;
    }
    #header .brand{pointer-events:none}
    #header .actions{display:flex;gap:10px;pointer-events:auto}
    .btn-glass{
        display:inline-flex;align-items:center;gap:8px;cursor:pointer;
        background:rgba(22,12,19,.7);border:1px solid rgba(212,175,55,.35);
        color:#f0d9a8;border-radius:12px;padding:9px 14px;font-size:13px;
        transition:all .25s ease;
    }
    .btn-glass:hover{background:rgba(216,40,128,.22);border-color:var(--gold);color:#fff}

    #dots{
        position:fixed;left:50%;bottom:4vh;transform:translateX(-50%);z-index:40;
        display:flex;gap:11px;align-items:center;
        background:rgba(22,12,19,.55);padding:9px 16px;border-radius:999px;
        border:1px solid rgba(212,175,55,.18);
    }
    .dot{width:9px;height:9px;border-radius:50%;border:1px solid var(--gold);opacity:.45;transition:all .35s ease}
    .dot.on{background:var(--rose);opacity:1;transform:scale(1.4);box-shadow:0 0 10px rgba(216,40,128,.9)}
    #scrollHint{
        position:fixed;left:50%;bottom:12vh;transform:translateX(-50%);z-index:40;
        color:rgba(255,248,248,.75);font-size:13px;letter-spacing:.3em;text-align:center;
        opacity:0;transition:opacity .6s ease;pointer-events:none;
    }
    #scrollHint.show{opacity:1}
    #scrollHint .mouse{
        width:22px;height:34px;margin:0 auto 8px;border:1.5px solid rgba(255,248,248,.7);
        border-radius:12px;position:relative;
    }
    #scrollHint .mouse::after{
        content:'';position:absolute;left:50%;top:6px;width:3px;height:7px;border-radius:3px;
        background:var(--gold);transform:translateX(-50%);animation:wheel 1.6s ease-in-out infinite;
    }
    @keyframes wheel{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,10px)}}

    #mobileBar{
        position:fixed;left:0;right:0;bottom:0;z-index:45;display:none;
        background:rgba(22,12,19,.9);border-top:1px solid rgba(212,175,55,.3);
        padding:14px 18px;text-align:center;
    }
    body.dbg #panel{outline:3px solid #00ff88}
    body.dbg .panel-card{background:#D82880 !important; opacity:1 !important}
    body.dbg #stage{outline:3px solid #00aaff}
    body.dbg .sec{outline:1px solid rgba(255,255,255,.35)}
    @media (max-width:1023px){
        #panel{display:none}
        #mobileBar{display:block}
    }
    @media (max-width:640px){
        #ballWrap{transform:scale(.58)}
        .sec .num{left:2vw}
        .sec .label{left:calc(2vw + 62px)}
    }

    /* ---------- 收尾全屏特效 ---------- */
    #burst{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;pointer-events:none;opacity:0;transition:none}
    body.anim #burst{transition:opacity .7s ease}
    #burst.show{opacity:1}
    .ring{
        position:absolute;left:50%;top:50%;width:78vmin;height:78vmin;
        margin:-39vmin 0 0 -39vmin;border-radius:50%;
        border:2px solid rgba(212,175,55,.75);
        box-shadow:0 0 30px rgba(212,175,55,.35), inset 0 0 40px rgba(216,40,128,.25);
        animation:ringPulse 2.6s ease-out infinite;
    }
    .ring.r2{animation-delay:.85s}.ring.r3{animation-delay:1.7s}
    @keyframes ringPulse{
        0%{transform:scale(.32);opacity:.95}
        100%{transform:scale(1.22);opacity:0}
    }
    #burst .burst-text{
        position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
        text-align:center;font-family:'Ma Shan Zheng',cursive;
        color:var(--yellow);text-shadow:0 0 24px rgba(255,208,47,.75),0 0 60px rgba(216,40,128,.6);
        font-size:clamp(34px,5vw,58px);letter-spacing:.18em;animation:burstIn 1.4s ease both;
    }
    #burst .burst-sub{
        position:absolute;left:50%;top:calc(52% + 58px);transform:translateX(-50%);
        font-size:14px;letter-spacing:.5em;color:rgba(243,233,230,.8);
        text-shadow:0 0 12px rgba(0,0,0,.6);animation:burstIn 1.4s .35s ease both;
    }
    @keyframes burstIn{0%{opacity:0;transform:translate(-50%,16px) scale(.9)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
    @keyframes burstInSub{0%{opacity:0;transform:translateX(-50%) translateY(12px)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}
    #burst .burst-sub{animation:burstInSub 1.4s .35s ease both}
    .spark{
        position:absolute;width:5px;height:5px;border-radius:50%;background:var(--yellow);
        box-shadow:0 0 10px var(--yellow),0 0 22px var(--rose);
        animation:sparkFloat 3.2s ease-in-out infinite;
    }
    @keyframes sparkFloat{
        0%{transform:translate(0,0);opacity:0}
        15%{opacity:1}
        100%{transform:translate(var(--dx), var(--dy));opacity:0}
    }
</style>
</head>
<body>

<!-- 底层：壮族织锦暗纹背景 -->
<div id="bg">
    <svg class="bg-pattern" aria-hidden="true">
        <defs>
            <pattern id="brocade" width="96" height="96" patternUnits="userSpaceOnUse">
                <rect width="96" height="96" fill="none"/>
                <path d="M48 6 L90 48 L48 90 L6 48 Z" fill="none" stroke="#D4AF37" stroke-width="1.2"/>
                <path d="M48 24 L72 48 L48 72 L24 48 Z" fill="none" stroke="#D82880" stroke-width="1"/>
                <circle cx="48" cy="48" r="3.5" fill="#00A8BB"/>
                <path d="M48 0 L54 10 L48 20 L42 10 Z" fill="#C41E70"/>
                <path d="M0 96 L6 86 L12 96 Z" fill="#FFD02F"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#brocade)"/>
    </svg>
    <div class="grain"></div>
    <div class="vignette"></div>
</div>

<!-- 长卷章节（由 JS 生成） -->
<main id="sections"></main>

<!-- 3D 绣球舞台 -->
<div id="stage">
    <div id="glow"></div>
    <div id="ballWrap">
        <div id="ball">
            <!-- 八片花瓣由 JS 生成 -->
            <div id="beads"></div>
            <div id="tassels"><div class="tassel-inner" id="tasselInner"></div></div>
            <div id="rope"><svg class="rope-svg" viewBox="0 0 30 64" width="30" height="64" aria-hidden="true">
                <path d="M15 62 C 27 44, 26 22, 15 3 C 5 20, 5 42, 15 62" fill="none" stroke="#C41E70" stroke-width="3.4" stroke-linecap="round"/>
                <path d="M15 62 C 27 44, 26 22, 15 3 C 5 20, 5 42, 15 62" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1" stroke-dasharray="3 4"/>
                <circle cx="15" cy="5" r="4.5" fill="none" stroke="#C41E70" stroke-width="3.2"/>
            </svg></div>
        </div>
    </div>
</div>

<!-- 共享渐变定义 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <radialGradient id="segSheen" cx=".3" cy=".18" r=".85">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
            <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
    </defs>
</svg>

<!-- 右侧文化卡片 -->
<aside id="panel"></aside>

<!-- 移动端底部条 -->
<div id="mobileBar"><span id="mobileTitle" class="font-calligraphy mobile-title"></span></div>

<!-- 顶部 -->
<header id="header">
    <div class="brand brand-row">
        <div class="brand-badge" style="background:linear-gradient(135deg,#D4AF37,#aa7c11);color:#2b1a08">
            <svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 3h12l4 6-10 12L2 9z"/></svg>
        </div>
        <div>
            <h1 class="font-calligraphy brand-title">八瓣绣球 · 壮族非遗文化长卷</h1>
            <p class="brand-sub">滚动即旋转 · 八瓣八章</p>
        </div>
    </div>
    <div class="actions">
        <button id="btnAuto" class="btn-glass"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span>自动演示</span></button>
        <button id="btnTop" class="btn-glass"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span class="top-label">回顶</span></button>
    </div>
</header>

<!-- 底部进度点 -->
<div id="dots"></div>

<!-- 滚动提示 -->
<div id="scrollHint">
    <div class="mouse"></div>
    向下滚动 · 绣球随页旋转
</div>

<!-- 收尾特效 -->
<div id="burst">
    <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div class="spark" style="left:18%;top:22%;--dx:36px;--dy:52px"></div>
    <div class="spark" style="left:82%;top:18%;--dx:-42px;--dy:60px"></div>
    <div class="spark" style="left:12%;top:70%;--dx:48px;--dy:-44px"></div>
    <div class="spark" style="left:88%;top:66%;--dx:-40px;--dy:-50px"></div>
    <div class="spark" style="left:50%;top:12%;--dx:8px;--dy:46px"></div>
    <div class="spark" style="left:30%;top:86%;--dx:30px;--dy:-30px"></div>
    <div class="spark" style="left:70%;top:88%;--dx:-28px;--dy:-34px"></div>
    <div class="burst-text">圆满一周 · 传承不息</div>
    <div class="burst-sub">愿壮乡祝福，转给世界，也转给下一个千年</div>
</div>

<script>
/* ========== 数据：八瓣 × 八章 ========== */
const DATA = [
    {
        n:'壹', title:'绣球起源', sub:'壮族民俗诞生',
        icon:'star',
        body:'绣球，壮族古称“飞砣”，最早源于壮族先民狩猎与作战时的投掷器具，后随岁月流转，演变为青年男女传情达意的信物。宋代文献中已见“绣球”之名。在漫长的农耕时光里，姑娘们把对丰收、平安与美满的祈愿一针一线绣进彩球——抛向心仪之人，也抛向吉祥与春天。'
    },
    {
        n:'贰', title:'抛绣球 · 婚嫁习俗', sub:'一球定情',
        icon:'heart',
        body:'歌圩三月三，壮家姑娘手持彩绣球，于人群之中看定意中人，彩球抛出、后生接住、互赠信物，一段良缘便由此结下。绣球因此成为壮族婚恋文化中最浪漫的信物：五彩绣球抛如意，一抛定终身。在婚礼上，绣球更寓意团圆和美、情比金坚。'
    },
    {
        n:'叁', title:'非遗手工 · 八瓣缝制工艺', sub:'金边不歪 · 珠串不松',
        icon:'craft',
        body:'一枚八瓣绣球，要经裁布、贴瓣、刺绣、合缝、镶珠、缀穗六道大工序：八片大红缎面各自绣上花鸟纹样，以金线锁边包缝，瓣与瓣交汇处缀白珍珠与金珠，底部垂挂渐变琉璃坠与长款玫红流苏，顶部束玫红缎吊绳。全程手工，讲究针脚细密、珠串匀称。壮族绣球制作技艺已被列入非物质文化遗产代表性项目名录。'
    },
    {
        n:'肆', title:'三月三 · 节庆活动', sub:'万人歌海 · 彩球起落',
        icon:'drum',

/* ========== 生成章节 / 球体 / 珠饰 / 流苏 / 卡片 / 进度点 ========== */

/* —— 八瓣球：每瓣由 4 片曲面段拼成（上 2 段 + 下 2 段），近似圆球曲面 —— */
const BALL_R = 150;
const DEG = Math.PI / 180;
const SEG_LEN = 2 * BALL_R * Math.sin(22.5 * DEG);                          // 段长 114.8
const W_EQU = 2 * BALL_R * Math.sin(22.5 * DEG);                            // 赤道宽 114.8
const W_45 = 2 * BALL_R * Math.cos(45 * DEG) * Math.sin(22.5 * DEG);        // 45° 纬宽 81.2

function segSvg(topW, botW, opts) {
    opts = opts || {};
    const W = 122, H = 123;
    const yT = 4, yB = H - 4, cx = W / 2;
    const xT1 = cx - topW / 2, xT2 = cx + topW / 2;
    const xB1 = cx - botW / 2, xB2 = cx + botW / 2;
    const midY = (yT + yB) / 2;
    const b = 3;
    const body =
        `M ${(xT1).toFixed(1)} ${yT} ` +
        `Q ${(xT1 - b).toFixed(1)} ${midY.toFixed(1)} ${(xB1).toFixed(1)} ${yB} ` +
        `L ${(xB2).toFixed(1)} ${yB} ` +
        `Q ${(xT2 + b).toFixed(1)} ${midY.toFixed(1)} ${(xT2).toFixed(1)} ${yT} Z`;
    const left = `M ${(xT1).toFixed(1)} ${yT} Q ${(xT1 - b).toFixed(1)} ${midY.toFixed(1)} ${(xB1).toFixed(1)} ${yB}`;
    const right = `M ${(xT2).toFixed(1)} ${yT} Q ${(xT2 + b).toFixed(1)} ${midY.toFixed(1)} ${(xB2).toFixed(1)} ${yB}`;
    let extra = '';
    if (opts.motif === 'top') extra += `<path d="M ${cx} ${yT + 16} l 7 9 -7 9 -7 -9 Z" fill="#FFD02F" opacity=".9"/>`;
    if (opts.motif === 'bottom') extra += `<path d="M ${cx} ${yB - 16} l 7 9 -7 9 -7 -9 Z" fill="#FFD02F" opacity=".9"/>`;
    if (opts.numeral) extra += `<text x="${cx}" y="${yT + 42}" text-anchor="middle" class="petal-label" font-size="18">${opts.numeral}</text>`;
    return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">` +
        `<path class="seg-body" d="${body}"/>` +
        `<path class="seg-sheen" d="${body}"/>` +
        `<path class="seg-side" d="${left}"/>` +
        `<path class="seg-side" d="${right}"/>` +
        extra +
        `</svg>`;
}

const NUM_CN = ['一','二','三','四','五','六','七','八'];

const dotsEl = document.getElementById('dots');

const cards = [...document.querySelectorAll('.panel-card')];
const dots = [...document.querySelectorAll('.dot')];
const mobileTitle = document.getElementById('mobileTitle');
const scrollHint = document.getElementById('scrollHint');
const burst = document.getElementById('burst');
const btnAuto = document.getElementById('btnAuto');

/* ========== 滚动联动 ========== */
let rot = 0;
let active = 0;
let velS = 0;
let lastY = window.scrollY;
let lastT = performance.now();
let autoOn = false;
let autoStart = 0;
let autoDir = 1;

const norm360 = (a) => { a = a % 360; return a < 0 ? a + 360 : a; };
const maxScroll = () => Math.max(1, document.documentElement.scrollHeight - innerHeight);

function setPanel(idx){
    cards.forEach((c, i) => c.classList.toggle('on', i === idx));
    dots.forEach((d, i) => d.classList.toggle('on', i === idx));
    mobileTitle.textContent = `第${NUM_CN[idx]}瓣 · ${DATA[idx].title}`;
    const hint = cards[idx].querySelector('.hintText');
    if (idx === 7) hint.textContent = '已转满一周 · 圆满收官';
    else hint.textContent = `继续滚动 · 切换至第 ${NUM_CN[idx + 1]} 瓣`;
    scrollHint.classList.toggle('show', idx === 0);
    burst.classList.toggle('show', idx === 7);
}

function tick(now){
    requestAnimationFrame(tick);
    const max = maxScroll();
    const p = Math.min(1, Math.max(0, window.scrollY / max));
    const target = p * 360;
    rot += (target - rot) * 0.16;
    if (Math.abs(target - rot) < 0.02) rot = target;
    ball.style.transform = `rotateY(${rot}deg)`;

    const idx = ((8 - Math.round(norm360(rot) / 45)) % 8 + 8) % 8;
    petals.forEach((el, i) => {
        const world = norm360(i * 45 + rot);
        const shade = 0.52 + 0.48 * Math.cos(world * Math.PI / 180);
        el.style.setProperty('--b', shade.toFixed(3));
        el.classList.toggle('active', world < 14 || world > 346);
        el.classList.toggle('front', world < 100 || world > 260);
    });
    if (idx !== active){ active = idx; setPanel(idx); }

    const glow = document.getElementById('glow');
    if (glow) glow.style.opacity = (0.55 + 0.22 * Math.sin(now * 0.0022)).toFixed(2);

    const dt = Math.max(16, now - lastT);
    const v = (window.scrollY - lastY) / dt;
    velS += (v - velS) * 0.08;
    lastY = window.scrollY; lastT = now;

    const amp = Math.min(24, Math.max(2, Math.abs(velS) * 0.45 + 1.5));
    const speed = 1.8 + amp * 0.055;
    const swing = amp * Math.sin(now * 0.001 * speed);
    tasselInner.style.transform = `translateX(-50%) rotate(${swing.toFixed(2)}deg)`;
}

/* 自动演示（26s 上行 + 26s 下行，用户滚动即停） */
function startAuto(){
    autoOn = true; autoStart = performance.now(); autoDir = 1;
    btnAuto.innerHTML = '<svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg><span>停止</span>';
}
function stopAuto(){
    autoOn = false;
    btnAuto.innerHTML = '<svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span>自动演示</span>';
}
function autoStep(now){
    if (!autoOn) return;
    const t = (now - autoStart) / 1000;
    const period = 26;
    let e = (t % (period * 2)) / period;
    if (e > 1) e = 2 - e;
    e = e * e * (3 - 2 * e);
    window.scrollTo(0, e * maxScroll());
    requestAnimationFrame(autoStep);
}
btnAuto.addEventListener('click', () => autoOn ? stopAuto() : (startAuto(), requestAnimationFrame(autoStep)));
document.getElementById('btnTop').addEventListener('click', () => window.scrollTo({top: 0, behavior: 'smooth'}));
window.addEventListener('wheel', () => { if (autoOn) stopAuto(); }, {passive: true});
window.addEventListener('touchstart', () => { if (autoOn) stopAuto(); }, {passive: true});

/* 截图 / 直达参数：?sec=3 */
window.addEventListener('load', () => {
    requestAnimationFrame(tick);
    setPanel(0);
    requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('anim')));
    if (location.hash.indexOf('dbg') > -1) document.body.classList.add('dbg');
    const secQ = parseInt(new URLSearchParams(location.search).get('sec') || '', 10);
    const secH = parseInt((location.hash.match(/sec=(\d+)/) || [])[1] || '', 10);
    const sec = !isNaN(secQ) ? secQ : secH;
    if (!isNaN(sec)) setTimeout(() => window.scrollTo(0, (Math.min(7, Math.max(0, sec)) / 8) * maxScroll()), 80);
});
