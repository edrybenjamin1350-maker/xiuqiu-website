name: Deploy to PythonAnywhere

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Upload and publish
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PYTHONANYWHERE_USERNAME: dupeng
          PYTHONANYWHERE_HOST: www.pythonanywhere.com
          PYTHONANYWHERE_DOMAIN: dupeng.pythonanywhere.com
        run: python scripts/deploy_pythonanywhere.py
