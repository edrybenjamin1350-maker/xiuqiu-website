<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>靖西壮族绣球 · 十二瓣文化长卷</title>
<meta name="description" content="以十二瓣立体绣球为视觉主体，滚动即旋转，讲述壮族绣球起源、婚嫁习俗、非遗工艺、三月三节庆、刺绣纹样、现代文创与文旅传承的文化长卷。">
<meta name="keywords" content="靖西绣球,壮族绣球,非物质文化遗产,三月三,壮族文化,十二瓣绣球">
<meta name="theme-color" content="#120a10">
<style>
    :root{
        --rose:#D82880;
        --gold:#D4AF37;
        --red:#FF3A3A;
        --yellow:#FFD02F;
        --cyan:#00C2D1;
        --tassel:#C41E70;
        --blue:#00A8BB;
        --pearl:#FFF8F8;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:auto}
    body{
        font-family:'Noto Serif SC','PingFang SC','Microsoft YaHei','STKaiti',serif;
        background:#120a10;
        color:#f3e9e6;
        overflow-x:hidden;
    }
    .font-calligraphy{font-family:'STKaiti','KaiTi','Kaiti SC','KaiTi_GB2312',serif}
    .ic{width:1em;height:1em;display:inline-block;vertical-align:-0.125em}
    .bg-pattern{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;opacity:.10}
    .brand-row{display:flex;align-items:center;gap:12px}
    .brand-badge{width:40px;height:40px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;box-shadow:0 8px 18px rgba(0,0,0,.45)}
    .brand-title{font-size:clamp(18px,1.6vw,24px);color:#fdeecb;letter-spacing:.08em}
    .brand-sub{font-size:11px;color:rgba(243,224,160,.5);letter-spacing:.3em;margin-top:2px}
    .mobile-title{font-size:18px;color:#fdeecb}
    @media (min-width:768px){.top-label{display:inline}}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:#160b12}
    ::-webkit-scrollbar-thumb{background:rgba(212,175,55,.35);border-radius:4px}
    ::-webkit-scrollbar-thumb:hover{background:rgba(212,175,55,.7)}

    /* ---------- 背景 ---------- */
    #bg{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;pointer-events:none}
    #bg .vignette{
        position:absolute;top:0;right:0;bottom:0;left:0;
        background:
            radial-gradient(ellipse at 50% 40%, rgba(216,40,128,.14), transparent 58%),
            radial-gradient(ellipse at 50% 115%, rgba(0,168,187,.12), transparent 52%),
            linear-gradient(180deg,#190c14,#120a10 50%,#0d070c);
    }
    #bg .grain{
        position:absolute;top:0;right:0;bottom:0;left:0;opacity:.55;mix-blend-mode:overlay;
        background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px),
            repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);
    }

    /* ---------- 长卷章节 ---------- */
    #sections{position:relative;z-index:10}
    .sec{position:relative;height:100vh;pointer-events:none}
    .sec .num{
        position:absolute;left:4vw;top:50%;transform:translateY(-50%);
        font-size:clamp(130px,24vh,280px);font-weight:700;line-height:1;
        color:transparent;-webkit-text-stroke:1px rgba(212,175,55,.16);
        font-family:'Ma Shan Zheng',cursive;user-select:none;
    }
    .sec .label{
        position:absolute;left:calc(4vw + 96px);top:50%;transform:translateY(-50%);
        writing-mode:vertical-rl;letter-spacing:.45em;color:rgba(243,233,230,.3);
        font-size:13px;text-transform:uppercase;user-select:none;
    }

    /* ---------- 3D 舞台 ---------- */
    #stage{
        position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;display:flex;align-items:center;justify-content:center;
        pointer-events:none;
    }
    #modelCanvas{
        width:min(560px,74vmin);height:min(680px,90vmin);
        display:block;cursor:grab;touch-action:pan-y;pointer-events:auto;
        transition:width .7s cubic-bezier(.2,.8,.2,1),height .7s cubic-bezier(.2,.8,.2,1),filter .7s ease;
    }
    #modelCanvas.dragging{cursor:grabbing}
    #themeBlend{
        --ripple-a:#8f1228;--ripple-b:#08a9d4;
        position:absolute;left:50%;top:50%;z-index:4;pointer-events:none;
        width:min(560px,74vmin);height:min(560px,74vmin);transform:translate(-50%,-50%);
    }
    .theme-ripple{
        position:absolute;left:50%;top:50%;width:76%;aspect-ratio:1;border-radius:50%;
        transform:translate(-50%,-50%) scale(1);opacity:0;will-change:transform,opacity;
        border:2px solid var(--ripple-a);box-shadow:0 0 18px color-mix(in srgb,var(--ripple-a) 58%,transparent),inset 0 0 14px color-mix(in srgb,var(--ripple-a) 34%,transparent);
    }
    .theme-ripple.ripple-b{
        border-color:var(--ripple-b);box-shadow:0 0 18px color-mix(in srgb,var(--ripple-b) 58%,transparent),inset 0 0 14px color-mix(in srgb,var(--ripple-b) 34%,transparent);
    }
    #themeBlend.playing .ripple-a{animation:themeRippleOut 1.5s cubic-bezier(.72,0,.18,1) both}
    #themeBlend.playing .ripple-b{animation:themeRippleOut 1.28s .22s cubic-bezier(.72,0,.18,1) both}
    @keyframes themeRippleOut{
        0%{opacity:0;transform:translate(-50%,-50%) scale(1)}
        13%{opacity:.72}
        52%{opacity:.42}
        100%{opacity:0;transform:translate(-50%,-50%) scale(1.58)}
    }
    #glow{
        position:absolute;left:50%;top:50%;width:min(620px,82vmin);height:min(620px,82vmin);
        margin:calc(min(620px,82vmin) / -2) 0 0 calc(min(620px,82vmin) / -2);
        border-radius:50%;pointer-events:none;opacity:0;transition:opacity .6s ease;
        background:radial-gradient(circle, rgba(255,208,47,.38), rgba(216,40,128,.22) 45%, transparent 70%);
        filter:blur(10px);
    }

    /* ---------- 右侧文化卡片 ---------- */
    #panel{
        position:fixed;right:3vw;top:50%;transform:translateY(-50%);z-index:40;
        width:410px;max-width:38vw;height:470px;max-height:64vh;pointer-events:none;
    }
    .panel-card{
        position:absolute;top:0;right:0;bottom:0;left:0;border-radius:18px;
        background:rgba(28,14,24,.86);
        border:1px solid rgba(212,175,55,.38);
        box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 0 40px rgba(216,40,128,.05);
        padding:26px 28px;opacity:0;transform:translateX(34px);
        transition:none;
        display:flex;flex-direction:column;pointer-events:none;
    }
    body.anim .panel-card{transition:opacity .55s ease, transform .55s ease}
    .panel-card.on{opacity:1;transform:none;pointer-events:auto}
    .panel-card .chip{
        display:inline-flex;align-items:center;gap:8px;
        font-size:12px;letter-spacing:.2em;color:var(--yellow);
        border:1px solid rgba(255,208,47,.35);background:rgba(255,208,47,.08);
        padding:5px 12px;border-radius:999px;align-self:flex-start;
    }
    .panel-card h2{
        font-size:clamp(24px,2.2vw,30px);color:#ffe9c2;margin-top:14px;
        text-shadow:0 0 18px rgba(216,40,128,.35);
    }
    .panel-card .sub{font-size:12px;color:rgba(243,233,230,.5);margin-top:4px;letter-spacing:.12em}
    .panel-card .divider{height:1px;margin:16px 0;background:linear-gradient(90deg,var(--gold),transparent)}
    .panel-card .body{
        flex:1;overflow-y:auto;font-size:14.5px;line-height:1.95;color:rgba(243,233,230,.88);
        text-align:justify;padding-right:4px;
    }
    .panel-card .body::-webkit-scrollbar{width:3px}
    .panel-card .hint{
        margin-top:14px;font-size:12.5px;color:rgba(212,175,55,.8);
        display:flex;align-items:center;gap:8px;letter-spacing:.08em;
    }
    .panel-card .hint i{animation:bob 1.6s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

    /* ---------- 顶部与底部指示 ---------- */
    #header{
        position:fixed;top:0;left:0;right:0;z-index:50;
        display:flex;justify-content:space-between;align-items:center;
        padding:18px 3vw;pointer-events:none;
    }
    #header .brand{pointer-events:none}
    #header .actions{display:flex;gap:10px;pointer-events:auto}
    #petalNavigator{
        position:absolute;left:50%;top:13px;transform:translateX(-50%);z-index:2;
        width:min(430px,35vw);padding:8px 14px 10px;border-radius:16px;
        background:linear-gradient(180deg,rgba(79,12,39,.88),rgba(30,10,23,.78));
        border:1px solid rgba(255,196,49,.38);box-shadow:0 12px 30px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.06);
        backdrop-filter:blur(14px);pointer-events:auto;transition:border-color .3s ease,box-shadow .3s ease;
    }
    #petalNavigator.interacting{border-color:rgba(255,208,47,.8);box-shadow:0 12px 34px rgba(0,0,0,.34),0 0 22px rgba(216,40,128,.2)}
    .petal-nav-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font-size:10px;letter-spacing:.18em;color:rgba(255,236,197,.58)}
    #petalNavLabel{font-weight:400;color:#ffd75a;letter-spacing:.12em}
    #petalTrack{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;cursor:ew-resize}
    #petalTrack::before{content:'';position:absolute;left:2%;right:2%;top:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,208,47,.6),transparent);pointer-events:none}
    .petal-stop{
        position:relative;z-index:1;width:100%;height:14px;padding:0;border:0;background:transparent;cursor:ew-resize;
    }
    .petal-stop::before{
        content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;
        transform:translate(-50%,-50%);background:#391423;border:1px solid rgba(255,208,47,.78);
        transition:transform .22s ease,background .22s ease,box-shadow .22s ease;
    }
    .petal-stop:hover::before,.petal-stop.on::before,.petal-stop:focus-visible::before{
        transform:translate(-50%,-50%) scale(1.55);background:var(--stop-color,var(--rose));box-shadow:0 0 0 3px rgba(255,208,47,.15),0 0 12px rgba(255,74,144,.9);
    }
    .petal-stop:focus-visible{outline:1px solid #ffd75a;outline-offset:2px;border-radius:6px}
    .btn-glass{
        display:inline-flex;align-items:center;gap:8px;cursor:pointer;
        background:rgba(22,12,19,.7);border:1px solid rgba(212,175,55,.35);
        color:#f0d9a8;border-radius:12px;padding:9px 14px;font-size:13px;
        transition:all .25s ease;
    }
    .btn-glass:hover{background:rgba(216,40,128,.22);border-color:var(--gold);color:#fff}
    a.btn-glass{text-decoration:none}

    #dots{
        position:fixed;left:50%;bottom:4vh;transform:translateX(-50%);z-index:40;
        display:flex;gap:11px;align-items:center;
        background:rgba(22,12,19,.55);padding:9px 16px;border-radius:999px;
        border:1px solid rgba(212,175,55,.18);
    }
    .dot{width:9px;height:9px;border-radius:50%;border:1px solid var(--gold);opacity:.45;transition:all .35s ease}
    .dot.on{background:var(--rose);opacity:1;transform:scale(1.4);box-shadow:0 0 10px rgba(216,40,128,.9)}
    #scrollHint{
        position:fixed;left:50%;bottom:12vh;transform:translateX(-50%);z-index:40;
        color:rgba(255,248,248,.75);font-size:13px;letter-spacing:.3em;text-align:center;
        opacity:0;transition:opacity .6s ease;pointer-events:none;
    }
    #scrollHint.show{opacity:1}
    #scrollHint .mouse{
        width:22px;height:34px;margin:0 auto 8px;border:1.5px solid rgba(255,248,248,.7);
        border-radius:12px;position:relative;
    }
    #scrollHint .mouse::after{
        content:'';position:absolute;left:50%;top:6px;width:3px;height:7px;border-radius:3px;
        background:var(--gold);transform:translateX(-50%);animation:wheel 1.6s ease-in-out infinite;
    }
    @keyframes wheel{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,10px)}}

    #mobileBar{
        position:fixed;left:0;right:0;bottom:0;z-index:45;display:none;
        background:rgba(22,12,19,.9);border-top:1px solid rgba(212,175,55,.3);
        padding:14px 18px;text-align:center;
    }
    @media (max-width:1023px){
        #panel{display:none}
        #mobileBar{display:block}
    }
    @media (max-width:1180px){#petalNavigator{display:none}}
    @media (max-width:640px){
        #modelCanvas{width:84vmin;height:104vmin}
        #themeBlend{width:84vmin;height:84vmin}
        .sec .num{left:2vw}
        .sec .label{left:calc(2vw + 62px)}
    }

    /* ---------- 沉浸赏球模式 ---------- */
    #exitImmersion{
        position:fixed;right:3vw;top:3vh;z-index:90;opacity:0;pointer-events:none;
        transform:translateY(-10px);transition:opacity .35s ease,transform .35s ease;
    }
    #exitImmersion .btn-glass{background:rgba(12,7,13,.68);backdrop-filter:blur(12px)}
    #header,#panel,#dots,#scrollHint,#mobileBar,#sections,#burst{transition:opacity .42s ease}
    body.immersive{overflow:hidden}
    body.immersive #header,
    body.immersive #panel,
    body.immersive #dots,
    body.immersive #scrollHint,
    body.immersive #mobileBar,
    body.immersive #sections,
    body.immersive #burst{opacity:0!important;pointer-events:none!important}
    body.immersive #stage{z-index:70;pointer-events:auto}
    body.immersive #modelCanvas{width:min(840px,92vmin);height:min(840px,92vmin);filter:drop-shadow(0 30px 34px rgba(0,0,0,.46))}
    body.immersive #themeBlend{width:min(840px,92vmin);height:min(840px,92vmin)}
    body.immersive #glow{opacity:.82!important;transform:scale(1.38);transition:transform .7s ease}
    body.immersive #exitImmersion{opacity:1;pointer-events:auto;transform:none}
    @media (max-width:640px){
        #exitImmersion{right:18px;top:18px}
        #exitImmersion .btn-glass{padding:9px 12px}
    }

    /* ---------- 收尾全屏特效 ---------- */
    #burst{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;pointer-events:none;opacity:0;transition:none}
    body.anim #burst{transition:opacity .7s ease}
    #burst.show{opacity:1}
    .ring{
        position:absolute;left:50%;top:50%;width:78vmin;height:78vmin;
        margin:-39vmin 0 0 -39vmin;border-radius:50%;
        border:2px solid rgba(212,175,55,.75);
        box-shadow:0 0 30px rgba(212,175,55,.35), inset 0 0 40px rgba(216,40,128,.25);
        animation:ringPulse 2.6s ease-out infinite;
    }
    .ring.r2{animation-delay:.85s}.ring.r3{animation-delay:1.7s}
    @keyframes ringPulse{
        0%{transform:scale(.32);opacity:.95}
        100%{transform:scale(1.22);opacity:0}
    }
    #burst .burst-text{
        position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
        text-align:center;font-family:'Ma Shan Zheng',cursive;
        color:var(--yellow);text-shadow:0 0 24px rgba(255,208,47,.75),0 0 60px rgba(216,40,128,.6);
        font-size:clamp(34px,5vw,58px);letter-spacing:.18em;animation:burstIn 1.4s ease both;
    }
    #burst .burst-sub{
        position:absolute;left:50%;top:calc(52% + 58px);transform:translateX(-50%);
        font-size:14px;letter-spacing:.5em;color:rgba(243,233,230,.8);
        text-shadow:0 0 12px rgba(0,0,0,.6);animation:burstIn 1.4s .35s ease both;
    }
    @keyframes burstIn{0%{opacity:0;transform:translate(-50%,16px) scale(.9)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
    @keyframes burstInSub{0%{opacity:0;transform:translateX(-50%) translateY(12px)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}
    #burst .burst-sub{animation:burstInSub 1.4s .35s ease both}
    .spark{
        position:absolute;width:5px;height:5px;border-radius:50%;background:var(--yellow);
        box-shadow:0 0 10px var(--yellow),0 0 22px var(--rose);
        animation:sparkFloat 3.2s ease-in-out infinite;
    }
    @keyframes sparkFloat{
        0%{transform:translate(0,0);opacity:0}
        15%{opacity:1}
        100%{transform:translate(var(--dx), var(--dy));opacity:0}
    }

    /* ========== 浅色数字博物馆视觉 ========== */
    :root{
        --museum-red:#7f1f28;
        --museum-red-dark:#54161c;
        --museum-ink:#312a27;
        --museum-muted:#7e746d;
        --museum-paper:#f3efe7;
        --museum-card:#fffdf8;
        --museum-line:#d8cdbd;
        --museum-gold:#ad8b46;
    }
    body{background:var(--museum-paper);color:var(--museum-ink)}
    ::-webkit-scrollbar-track{background:#eee8de}
    ::-webkit-scrollbar-thumb{background:rgba(127,31,40,.32)}
    ::-webkit-scrollbar-thumb:hover{background:rgba(127,31,40,.6)}
    #bg .vignette{
        background:
            radial-gradient(ellipse at 49% 43%,rgba(255,255,255,.98),rgba(255,253,248,.82) 34%,transparent 63%),
            radial-gradient(ellipse at 48% 112%,rgba(173,139,70,.09),transparent 52%),
            linear-gradient(180deg,#f8f5ee,#f1ece3 58%,#eae3d9);
    }
    #bg .grain{opacity:.22;mix-blend-mode:multiply;background-image:repeating-linear-gradient(0deg,rgba(88,65,51,.025) 0 1px,transparent 1px 4px)}
    .bg-pattern{opacity:.035}

    #header{
        height:84px;padding:0 3vw;background:rgba(255,253,248,.94);
        border-bottom:1px solid rgba(127,31,40,.14);box-shadow:0 8px 28px rgba(77,50,35,.07);
        backdrop-filter:blur(16px);
    }
    #header::after{content:'';position:absolute;left:0;right:0;bottom:-3px;height:2px;background:linear-gradient(90deg,transparent 3%,var(--museum-red) 18%,var(--museum-red) 82%,transparent 97%);opacity:.72}
    #header .brand-badge{
        width:44px;height:44px;border-radius:4px!important;background:var(--museum-red)!important;
        color:#f5dfaa!important;box-shadow:none;transform:rotate(45deg);
    }
    #header .brand-badge .ic{transform:rotate(-45deg);font-size:17px}
    .brand-title{font-size:26px;color:var(--museum-red-dark);letter-spacing:.18em;line-height:1.1}
    .brand-sub{font-size:11px;color:#94867c;letter-spacing:.34em;margin-top:6px}

    #museumNav{
        position:absolute;left:50%;top:0;height:84px;transform:translateX(-50%);
        display:flex;align-items:center;gap:clamp(15px,1.55vw,28px);pointer-events:auto;white-space:nowrap;
    }
    #museumNav a{
        position:relative;color:#51443e;text-decoration:none;font-size:15px;letter-spacing:.08em;
        padding:32px 0 29px;transition:color .25s ease;
    }
    #museumNav a::after{content:'';position:absolute;left:50%;right:50%;bottom:0;height:3px;background:var(--museum-red);transition:left .25s ease,right .25s ease}
    #museumNav a:hover,#museumNav a.on{color:var(--museum-red)}
    #museumNav a:hover::after,#museumNav a.on::after{left:0;right:0}

    #petalNavigator{
        position:fixed;top:98px;left:50%;width:min(640px,48vw);padding:11px 20px 13px;
        background:rgba(255,253,248,.9);border:1px solid rgba(127,31,40,.17);border-radius:2px;
        box-shadow:0 10px 28px rgba(83,56,40,.08);backdrop-filter:blur(12px);
    }
    #petalNavigator.interacting{border-color:rgba(127,31,40,.48);box-shadow:0 12px 30px rgba(83,56,40,.12)}
    .petal-nav-meta{color:#8e8178;margin-bottom:9px;font-size:12px;letter-spacing:.13em}
    #petalNavLabel{color:var(--museum-red);font-weight:500}
    #petalTrack::before{background:linear-gradient(90deg,transparent,rgba(127,31,40,.4),transparent)}
    .petal-stop{height:18px}
    .petal-stop::before{width:9px;height:9px;background:#fffaf1;border-color:rgba(127,31,40,.65)}
    .petal-stop:hover::before,.petal-stop.on::before,.petal-stop:focus-visible::before{box-shadow:0 0 0 3px rgba(127,31,40,.08),0 0 10px rgba(127,31,40,.28)}

    .btn-glass,#exitImmersion .btn-glass{
        background:#fffdf8;border:1px solid #cfc2b1;color:var(--museum-red-dark);
        border-radius:2px;box-shadow:none;backdrop-filter:none;font-size:14px;padding:11px 16px;
    }
    .btn-glass:hover{background:var(--museum-red);border-color:var(--museum-red);color:#fffaf2}

    .sec .num{-webkit-text-stroke:1px rgba(127,31,40,.12);color:transparent}
    .sec .label{color:rgba(78,57,48,.38)}
    #glow{background:radial-gradient(circle,rgba(255,255,255,.94),rgba(216,184,111,.18) 44%,transparent 72%);filter:blur(14px)}

    #panel{width:380px;max-width:32vw;height:448px;max-height:62vh}
    .panel-card{
        border-radius:3px;background:rgba(255,253,248,.96);border:1px solid var(--museum-line);
        box-shadow:0 22px 55px rgba(82,55,39,.11);padding:30px 32px;
    }
    .panel-card::before{content:'';position:absolute;left:10px;right:10px;top:10px;bottom:10px;border:1px solid rgba(127,31,40,.08);pointer-events:none}
    .panel-card .chip{color:var(--museum-red);border-color:rgba(127,31,40,.24);background:rgba(127,31,40,.04);border-radius:2px}
    .panel-card h2{color:var(--museum-red-dark);text-shadow:none;font-size:clamp(25px,2.2vw,31px)}
    .panel-card .sub{color:#94877e}
    .panel-card .divider{background:linear-gradient(90deg,var(--museum-red),rgba(127,31,40,.08),transparent)}

function makeVividColor(color, saturationScale = 1.26) {
    const result = new THREE.Color(color);
    const hsl = {};
    result.getHSL(hsl);
    result.setHSL(
        hsl.h,
        Math.min(1, hsl.s * saturationScale + .035),
        Math.min(.82, hsl.l * 1.035 + .008)
    );
    return result;
}

function adjustColorBrightness(hex, percent) {
    let num = parseInt(hex.replace('#', ''), 16);
    let amt = Math.round(2.55 * percent);
    let R = (num >> 16) + amt, G = (num >> 8 & 0x00FF) + amt, B = (num & 0x0000FF) + amt;
    R = Math.min(255, Math.max(0, R));
    G = Math.min(255, Math.max(0, G));
    B = Math.min(255, Math.max(0, B));
    return '#' + (0x1000000 + (R << 16) + (G << 8) + B).toString(16).slice(1);
}

function generateEmbroideryTexture(silkColor, motif = 'flower') {
    const canvas = document.createElement('canvas');
    canvas.width = 768; canvas.height = 768;
    const ctx = canvas.getContext('2d');
    const silk = ctx.createLinearGradient(0, 0, 768, 768);
    silk.addColorStop(0, '#ffffff');
    silk.addColorStop(.34, '#f4eee8');
    silk.addColorStop(.7, '#cdbfb5');
    silk.addColorStop(1, '#f8f3ed');
    ctx.fillStyle = silk;
    ctx.fillRect(0, 0, 768, 768);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.11)';
    ctx.lineWidth = 1;
    for (let i = -768; i < 1536; i += 5) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i - 300, 768); ctx.stroke();
    }
    ctx.save();
    ctx.translate(384, 384);
    const drawCurve = (strokeColor, lineWidth, pathPoints) => {
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = lineWidth;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        pathPoints.forEach((pt, idx) => {
            if (idx === 0) ctx.moveTo(pt[0], pt[1]);
            else ctx.lineTo(pt[0], pt[1]);
        });
        ctx.stroke();
    };
    const petal = (x, y, rx, ry, color, turn) => {
        ctx.save(); ctx.translate(x, y); ctx.rotate(turn);
        ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#f9d66a'; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
    };
    const stem = () => {
        drawCurve('#63b55f', 11, [[-12,180],[-18,78],[16,-54],[5,-176]]);
        drawCurve('#d8f09f', 2, [[-9,170],[-12,72],[20,-50],[8,-168]]);
        drawCurve('#63b55f', 8, [[-8,54],[-103,18],[-130,-25]]);
        drawCurve('#63b55f', 8, [[2,-12],[105,-54],[130,-106]]);
    };
    stem();
    if (motif === 'bird') {
        ctx.fillStyle = '#1f89bd'; ctx.beginPath(); ctx.ellipse(-16,-20,72,35,-.26,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#f3d13c'; ctx.beginPath(); ctx.ellipse(-42,-19,31,22,-.45,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ec4943'; ctx.beginPath(); ctx.ellipse(34,-31,26,20,.1,0,Math.PI*2); ctx.fill();

        drawCurve('#f3d13c',8,[[52,-31],[96,-44],[116,-34]]);
        drawCurve('#e83d54',9,[[-72,-20],[-125,-74],[-144,-66]]);
    } else if (motif === 'butterfly') {
        ['#ffd343','#f26c98','#75c8db','#f9bb42'].forEach((c,i)=>petal((i<2?-28:28),(i%2?-32:32),34,55,c,(i%2?-.65:.65)*(i<2?1:-1)));
        ctx.fillStyle='#40243d';ctx.fillRect(-5,-55,10,118);drawCurve('#40243d',4,[[0,-53],[-22,-80],[-34,-90]]);drawCurve('#40243d',4,[[0,-53],[22,-80],[34,-90]]);
    } else {
        const colors = motif === 'peony' ? ['#f9c0d0','#ee527b','#ffd543','#d83255','#f8e4a0'] : motif === 'orchid' ? ['#f5f5ff','#67b9e8','#cbd5ff','#ffffff','#f4cf45'] : ['#f4a1be','#f5d05a','#ef5a66','#8dd3a3','#fff1bb'];
        for(let i=0;i<5;i++) petal(Math.cos(i*Math.PI*2/5)*44,Math.sin(i*Math.PI*2/5)*44,36,80,colors[i],i*Math.PI*2/5);
        ctx.fillStyle='#f3c73c';ctx.beginPath();ctx.arc(0,0,25,0,Math.PI*2);ctx.fill();
        for(let i=0;i<14;i++){ctx.fillStyle=i%2?'#a73a36':'#fff2a5';ctx.beginPath();ctx.arc(Math.cos(i*.45)*i*1.7,Math.sin(i*.45)*i*1.7,4,0,Math.PI*2);ctx.fill();}
    }
    ctx.restore();
    const texture = new THREE.CanvasTexture(canvas);

    texture.wrapT = THREE.ClampToEdgeWrapping;
    texture.anisotropy = renderer ? renderer.capabilities.getMaxAnisotropy() : 1;
    return texture;
}

function generateReferenceEmbroideryTexture(motif = 'flower', variant = 0, baseColor = '#d34a62') {
    const size = 512;
    const colorCanvas = document.createElement('canvas');
    const bumpCanvas = document.createElement('canvas');
    colorCanvas.width = colorCanvas.height = size;
    bumpCanvas.width = bumpCanvas.height = size;
    const ctx = colorCanvas.getContext('2d');
    const bump = bumpCanvas.getContext('2d');

    // 预览款把缎面底色直接烘焙进贴图，避免材质颜色与彩色绣线相乘后失真。
    ctx.fillStyle = baseColor;
    ctx.fillRect(0,0,size,size);
    const satin = ctx.createLinearGradient(0,0,size,size);
    satin.addColorStop(0,'rgba(255,255,255,.34)');
    satin.addColorStop(.24,'rgba(255,255,255,.06)');
    satin.addColorStop(.5,'rgba(255,255,255,.24)');
    satin.addColorStop(.76,'rgba(40,8,20,.12)');
    satin.addColorStop(1,'rgba(255,255,255,.18)');
    ctx.fillStyle = satin;
    ctx.fillRect(0,0,size,size);
    bump.fillStyle = '#777';
    bump.fillRect(0,0,size,size);

    // 细密的经纬丝线，让底布在光照下出现真实的缎面方向性。
    for(let i=-size;i<size*2;i+=5){
        ctx.strokeStyle = i%15===0 ? 'rgba(255,255,255,.2)' : 'rgba(77,42,31,.055)';
        ctx.lineWidth = i%15===0 ? 1.2 : .7;
        ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i-size*.42,size);ctx.stroke();
        bump.strokeStyle = i%15===0 ? '#858585' : '#727272';
        bump.lineWidth = 1;
        bump.beginPath();bump.moveTo(i,0);bump.lineTo(i-size*.42,size);bump.stroke();
    }
    for(let y=0;y<size;y+=7){
        ctx.strokeStyle='rgba(255,255,255,.045)';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(size,y+18);ctx.stroke();
    }

    ctx.save(); bump.save();
    ctx.translate(size/2,size/2); bump.translate(size/2,size/2);
    ctx.rotate(-Math.PI/2); bump.rotate(-Math.PI/2);
    const textureScale = size / 768;
    ctx.scale(1.22 * textureScale,1.22 * textureScale);
    bump.scale(1.22 * textureScale,1.22 * textureScale);

    const threadStroke = (points,color,width=12) => {
        const path = new Path2D();
        points.forEach((point,index)=>index ? path.lineTo(point[0],point[1]) : path.moveTo(point[0],point[1]));
        ctx.lineCap='round';ctx.lineJoin='round';
        ctx.strokeStyle='rgba(55,20,20,.3)';ctx.lineWidth=width+5;ctx.stroke(path);
        ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke(path);
        ctx.setLineDash([4,5]);ctx.lineDashOffset=variant%4;
        ctx.strokeStyle='rgba(255,255,255,.58)';ctx.lineWidth=Math.max(2.5,width*.2);ctx.stroke(path);
        ctx.setLineDash([]);
        bump.lineCap='round';bump.lineJoin='round';bump.strokeStyle='#e8e8e8';bump.lineWidth=width+3;bump.stroke(path);
        bump.setLineDash([4,5]);bump.strokeStyle='#fff';bump.lineWidth=Math.max(3,width*.28);bump.stroke(path);bump.setLineDash([]);
    };

    const threadedEllipse = (x,y,rx,ry,rotation,color) => {
        ctx.save();ctx.translate(x,y);ctx.rotate(rotation);
        ctx.shadowColor='rgba(55,16,20,.3)';ctx.shadowBlur=5;ctx.shadowOffsetY=3;
        ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.shadowColor='transparent';
        ctx.save();ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.clip();
        for(let xx=-rx-ry;xx<rx+ry;xx+=7){
            ctx.strokeStyle=((xx+rx+ry)/7)%2<1?'rgba(255,255,255,.62)':'rgba(70,20,30,.24)';ctx.lineWidth=3.2;
            ctx.beginPath();ctx.moveTo(xx,-ry*1.2);ctx.lineTo(xx+ry*.55,ry*1.2);ctx.stroke();
        }
        ctx.restore();ctx.strokeStyle='rgba(255,230,142,.72)';ctx.lineWidth=3;ctx.stroke();ctx.restore();
        bump.save();bump.translate(x,y);bump.rotate(rotation);bump.fillStyle='#e7e7e7';bump.beginPath();bump.ellipse(0,0,rx,ry,0,0,Math.PI*2);bump.fill();
        for(let xx=-rx;xx<rx;xx+=8){bump.strokeStyle='#fff';bump.lineWidth=3.5;bump.beginPath();bump.moveTo(xx,-ry*.85);bump.lineTo(xx+ry*.35,ry*.85);bump.stroke();}
        bump.restore();
    };

    const threadedPolygon = (points,color) => {
        const path = new Path2D();
        points.forEach((point,index)=>index?path.lineTo(point[0],point[1]):path.moveTo(point[0],point[1]));path.closePath();
        ctx.save();ctx.shadowColor='rgba(50,15,20,.3)';ctx.shadowBlur=5;ctx.shadowOffsetY=3;ctx.fillStyle=color;ctx.fill(path);ctx.shadowColor='transparent';
        ctx.save();ctx.clip(path);for(let x=-250;x<250;x+=8){ctx.strokeStyle=((x+250)/8)%2<1?'rgba(255,255,255,.58)':'rgba(60,18,25,.22)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,-230);ctx.lineTo(x+170,230);ctx.stroke();}ctx.restore();
        ctx.strokeStyle='rgba(255,229,143,.75)';ctx.lineWidth=3;ctx.stroke(path);ctx.restore();
        bump.fillStyle='#e5e5e5';bump.fill(path);bump.strokeStyle='#fff';bump.lineWidth=3;bump.stroke(path);
    };

    const stem = (from=[0,175],to=[0,-105]) => threadStroke([from,[from[0]-22,42],[to[0]+16,-28],to],'#319153',9);
    const leaf = (x,y,turn,color='#4aaa61') => threadedEllipse(x,y,22,58,turn,color);
    const fivePetalFlower = (cx,cy,palette,scale=1) => {
        for(let i=0;i<5;i++){
            const angle=i*Math.PI*2/5-Math.PI/2;
            threadedEllipse(cx+Math.cos(angle)*35*scale,cy+Math.sin(angle)*35*scale,24*scale,44*scale,angle+Math.PI/2,palette[i%palette.length]);
        }
        threadedEllipse(cx,cy,26*scale,26*scale,0,'#f4bf31');
        for(let i=0;i<12;i++)threadStroke([[cx,cy],[cx+Math.cos(i*.524)*22*scale,cy+Math.sin(i*.524)*22*scale]],i%2?'#8b322e':'#fff0a2',3);
    };

    if(motif==='tulip'){

function generatePanelTexture(baseColor, panelIndex) {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createRadialGradient(210, 180, 30, 256, 256, 350);
    gradient.addColorStop(0, '#ffffff');
    gradient.addColorStop(.58, '#eee7dc');
    gradient.addColorStop(1, '#c8b9aa');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 512, 512);

    ctx.lineWidth = 1;
    for (let y = -512; y < 1024; y += 4) {
        ctx.strokeStyle = y % 12 === 0 ? 'rgba(255,255,255,.13)' : 'rgba(92,33,10,.07)';
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y + 190); ctx.stroke();
    }

    ctx.save();
    ctx.translate(256, 278);
    ctx.rotate((panelIndex % 2 ? 1 : -1) * .08);
    ctx.strokeStyle = 'rgba(255,239,160,.34)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-92, 36); ctx.quadraticCurveTo(0, -76, 92, 36);
    ctx.quadraticCurveTo(0, 108, -92, 36);
    ctx.stroke();
    ctx.restore();

    const texture = new THREE.CanvasTexture(canvas);
    texture.anisotropy = renderer ? renderer.capabilities.getMaxAnisotropy() : 1;
    return texture;
}

function createCurvedTrianglePanel(A, B, C, panelIndex) {
    const segments = 18;
    const radius = MODEL_R * .995;
    const positions = [];
    const uvs = [];
    const indices = [];
    const rows = [];

    for (let i = 0; i <= segments; i++) {
        const row = [];
        for (let j = 0; j <= segments - i; j++) {
            const k = segments - i - j;
            const point = A.clone().multiplyScalar(i)
                .add(B.clone().multiplyScalar(j))
                .add(C.clone().multiplyScalar(k))
                .divideScalar(segments)
                .normalize()
                .multiplyScalar(radius);
            row.push(positions.length / 3);
            positions.push(point.x, point.y, point.z);
            uvs.push((j + k * .5) / segments, k / segments);
        }
        rows.push(row);
    }

    for (let i = 0; i < segments; i++) {
        for (let j = 0; j < segments - i; j++) {
            const a = rows[i][j];
            const b = rows[i + 1][j];
            const c = rows[i][j + 1];
            indices.push(a, b, c);
            if (j < segments - i - 1) {
                const d = rows[i + 1][j + 1];
                indices.push(b, d, c);
            }
        }
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geometry.setIndex(indices);
    geometry.computeVertexNormals();

    const baseColor = PANEL_COLORS[panelIndex % PANEL_COLORS.length];
    const material = new THREE.MeshPhysicalMaterial({
        color: baseColor,
        map: generatePanelTexture(baseColor, panelIndex),
        roughness: .34,
        metalness: .04,
        clearcoat: .3,
        clearcoatRoughness: .2,
        side: THREE.DoubleSide
    });
    material.userData.paletteSlot = panelIndex;
    panelMaterials.push(material);
    return new THREE.Mesh(geometry, material);
}

    });
}

function createPetalMesh(A, B, radius, widthFactor, puffFactor, petalIndex) {
    const uSegments = 32, vSegments = 16;
    const outerPositions = [], innerPositions = [];
    const leftBorderOuter = [], leftBorderInner = [], rightBorderOuter = [], rightBorderInner = [];
    const midVector = new THREE.Vector3().addVectors(A, B).normalize();
    const depthRatio = Math.max(0, Math.min(0.85, MODEL_STATE.extrudeDepth));
    for (let i = 0; i <= uSegments; i++) {
        const u = i / uSegments;
        const currentCenter = new THREE.Vector3().subVectors(B, A).multiplyScalar(u).add(A).normalize();
        const chord = new THREE.Vector3().subVectors(B, A);
        const tangent = chord.clone().sub(currentCenter.clone().multiplyScalar(chord.dot(currentCenter))).normalize();
        const normal = currentCenter.clone();
        const side = new THREE.Vector3().crossVectors(normal, tangent).normalize();
        // 中段保持宽大，两端快速收尖，避免相邻锦瓣在串珠节点附近互相穿插。
        const currentWidth = widthFactor * Math.pow(Math.sin(Math.PI * u), 1.16);
        const rowOuter = [], rowInner = [];
        for (let j = 0; j <= vSegments; j++) {
            const v = (j / vSegments) - 0.5;
            const lengthRound = Math.pow(Math.sin(Math.PI * u), .78);
            const widthRound = Math.pow(Math.max(0, Math.cos(Math.PI * v)), 1.35);
            const puff = puffFactor * lengthRound * widthRound;
            const posOuter = currentCenter.clone().multiplyScalar(radius)
                .add(side.clone().multiplyScalar(v * currentWidth * radius))
                .add(normal.clone().multiplyScalar(puff * radius));
            const posInner = posOuter.clone().multiplyScalar(1 - depthRatio);
            rowOuter.push(posOuter);
            rowInner.push(posInner);
            if (j === 0) { leftBorderOuter.push(posOuter.clone()); leftBorderInner.push(posInner.clone()); }
            if (j === vSegments) { rightBorderOuter.push(posOuter.clone()); rightBorderInner.push(posInner.clone()); }
        }
        outerPositions.push(rowOuter);
        innerPositions.push(rowInner);
    }
    const outerGeom = new THREE.BufferGeometry();
    const outerPosArr = [], outerUvs = [], outerIndices = [];
    const stride = vSegments + 1;
    for (let i = 0; i <= uSegments; i++) {
        for (let j = 0; j <= vSegments; j++) {
            const p = outerPositions[i][j];
            outerPosArr.push(p.x, p.y, p.z);
            outerUvs.push(i / uSegments, j / vSegments);
        }
    }
    for (let i = 0; i < uSegments; i++) {
        for (let j = 0; j < vSegments; j++) {
            const a = i * stride + j, b = a + stride, c = b + 1, d = a + 1;
            outerIndices.push(a, b, d, b, c, d);
        }
    }
    outerGeom.setAttribute('position', new THREE.Float32BufferAttribute(outerPosArr, 3));
    outerGeom.setAttribute('uv', new THREE.Float32BufferAttribute(outerUvs, 2));
    outerGeom.setIndex(outerIndices);
    outerGeom.computeVertexNormals();
    const silkColor = PETAL_COLORS[petalIndex % PETAL_COLORS.length];
    const previewBaseColor = makeVividColor(silkColor,1.34).getStyle();
    const embroideryPreview = generateReferenceEmbroideryTexture(REFERENCE_MOTIFS[petalIndex % REFERENCE_MOTIFS.length],petalIndex,previewBaseColor);
    const silkMat = new THREE.MeshPhysicalMaterial({
        map: embroideryPreview.map,
        bumpMap: embroideryPreview.bumpMap,
        bumpScale: .075,
        color: '#ffffff',
        roughness: 0.58,
        metalness: 0.01,
        clearcoat: 0.08,
        clearcoatRoughness: 0.62,
        side: THREE.FrontSide
    });
    silkMat.userData.embroideryThemeIndex = 0;
    silkMat.userData.embroideryMap = embroideryPreview.map;
    silkMat.userData.embroideryBumpMap = embroideryPreview.bumpMap;
    silkMat.userData.motif = REFERENCE_MOTIFS[petalIndex % REFERENCE_MOTIFS.length];
    silkMat.userData.petalIndex = petalIndex;
    silkMat.userData.previewColor = new THREE.Color('#ffffff');
    petalMaterials.push(silkMat);
    const outerMesh = new THREE.Mesh(outerGeom, silkMat);
    const wallGroup = new THREE.Group();
    if (depthRatio > 0.01) {
        const wallGeom = new THREE.BufferGeometry();
        const wallPosArr = [], wallIndices = [];
        const addWallStrip = (outerPts, innerPts, reverse) => {
            const startIndex = wallPosArr.length / 3;
            for (let k = 0; k < outerPts.length; k++) {
                const po = outerPts[k], pi = innerPts[k];
                wallPosArr.push(po.x, po.y, po.z);
                wallPosArr.push(pi.x, pi.y, pi.z);
            }
            for (let k = 0; k < outerPts.length - 1; k++) {
                const o1 = startIndex + k * 2, i1 = startIndex + k * 2 + 1;
                const o2 = startIndex + (k + 1) * 2, i2 = startIndex + (k + 1) * 2 + 1;
                if (!reverse) {
                    wallIndices.push(o1, i1, o2, i1, i2, o2);
                } else {
                    wallIndices.push(o1, o2, i1, i1, o2, i2);
                }
            }
        };
        addWallStrip(leftBorderOuter, leftBorderInner, false);
        addWallStrip(rightBorderOuter, rightBorderInner, true);
        wallGeom.setAttribute('position', new THREE.Float32BufferAttribute(wallPosArr, 3));
        wallGeom.setIndex(wallIndices);
        wallGeom.computeVertexNormals();
        const wallMat = new THREE.MeshStandardMaterial({
            color: adjustColorBrightness(silkColor, -32),
            roughness: 0.4,
            metalness: 0.1,
            side: THREE.DoubleSide
        });
        wallMat.userData.paletteSlot = petalIndex;
        petalSideMaterials.push(wallMat);
        wallGroup.add(new THREE.Mesh(wallGeom, wallMat));
    }
    const trimCurvePoints = [...leftBorderOuter, ...rightBorderOuter.reverse()];
    const trimCurve = new THREE.CatmullRomCurve3(trimCurvePoints, true);
    const trimGeom = new THREE.TubeGeometry(trimCurve, 32, 0.04, 6, true);
    const goldMat = new THREE.MeshStandardMaterial({
        color: 0xffc62f,
        metalness: 0.82,
        roughness: 0.18
    });
    goldMaterials.push(goldMat);
    const petalGroup = new THREE.Group();
    petalGroup.add(outerMesh);
    petalGroup.add(wallGroup);
    petalGroup.add(new THREE.Mesh(trimGeom, goldMat));
    petalGroup.userData = { centerDir: midVector.clone(), nodeA: A, nodeB: B };
    petalDirs.push(midVector.clone());
    return petalGroup;
}

function buildTassels(configCount) {
    tasselsGroup.clear();
    tasselDynamics = [];
    if (configCount === 0) return;
    const targetNodeIndices = configCount === 5 ? [1, 2, 3, 4, 5] : [1];
    targetNodeIndices.forEach((nodeIdx) => {
        const nodePos = NODES[nodeIdx];
        const tasselGroup = new THREE.Group();
        const isMainBottom = (nodeIdx === 1);
        const scale = isMainBottom ? 1.0 : 0.75;
        const outward = nodePos.clone().normalize();
        // 四组侧流苏先离开球面，再略向外倾斜，防止珠链与下半球锦瓣穿模。
        tasselGroup.position.copy(nodePos).multiplyScalar(isMainBottom ? 1.025 : 1.12);
        const hangingDirection = new THREE.Vector3(0, -1, 0)
            .add(outward.clone().multiplyScalar(isMainBottom ? 0 : .30))
            .normalize();
        tasselGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), hangingDirection);
        const beadMat = new THREE.MeshPhysicalMaterial({
            color: 0xfff8e7,
            roughness: 0.1,
            clearcoat: 1.0
        });
        const amberMat = new THREE.MeshStandardMaterial({ color: 0xe9ad21, roughness: 0.2, metalness: 0.62 });
        beadMat.userData.paletteRole = 'pearl';
        amberMat.userData.paletteRole = 'accent';
        beadMaterials.push(beadMat, amberMat);
        for (let b = 0; b < 5; b++) {
            const bead = new THREE.Mesh(new THREE.SphereGeometry((b % 2 ? 0.075 : 0.1) * scale, 12, 10), b % 2 ? amberMat : beadMat);
            bead.position.y = -0.22 * (b + 1) * scale;
            tasselGroup.add(bead);
        }
        const capGeom = new THREE.ConeGeometry(0.24 * scale, 0.42 * scale, 16);
        const capMesh = new THREE.Mesh(capGeom, amberMat);
        capMesh.position.y = -1.2 * scale;
        capMesh.rotation.x = Math.PI;
        tasselGroup.add(capMesh);
        // 以尖帽尖端作为整束流苏的唯一铰接点，丝线从这里汇拢后再自然散开。
        const strandRoot = new THREE.Group();
        strandRoot.position.y = -1.40 * scale;
        tasselGroup.add(strandRoot);
        const tasselColors = nodeIdx % 2 ? ['#f2c72e','#f6d643','#e9ad21'] : ['#d51d4e','#f1ba2b','#1c9d73'];
        for (let s = 0; s < 18; s++) {
            const a = (s / 18) * Math.PI * 2;
            const drift = .16 + (s % 4) * .022;
            const curve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(Math.cos(a) * .025 * scale, -.18 * scale, Math.sin(a) * .025 * scale),
                new THREE.Vector3(Math.cos(a) * drift * .42 * scale, -.76 * scale, Math.sin(a) * drift * .42 * scale),
                new THREE.Vector3(Math.cos(a) * drift * .78 * scale, -1.58 * scale, Math.sin(a) * drift * .78 * scale),
                new THREE.Vector3(Math.cos(a) * (drift + .07) * scale, -2.50 * scale, Math.sin(a) * (drift + .07) * scale)
            ]);
            const strandMaterial = new THREE.MeshStandardMaterial({color:tasselColors[s % tasselColors.length],roughness:.48,metalness:.04});
            strandMaterial.userData.paletteSlot = s % 3;
            tasselMaterials.push(strandMaterial);
            const strand = new THREE.Mesh(new THREE.TubeGeometry(curve, 20, .014 * scale, 5, false), strandMaterial);
            strandRoot.add(strand);
        }
        tasselDynamics.push({
            root: strandRoot,
            phase: nodeIdx * 1.37,
            angle: 0,
            velocity: 0,
            weight: isMainBottom ? 1 : .82
        });
        tasselsGroup.add(tasselGroup);
    });
}

function buildTopRibbon() {
    ribbonGroup.clear();
    const topNode = NODES[0];
    const ribbonMat = new THREE.MeshPhysicalMaterial({
        color: 0xd92f4c,
        roughness: 0.28,
        clearcoat: .35,
        side: THREE.DoubleSide
    });
    ribbonMaterials.push(ribbonMat);
    const loopCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0,-.38,0),
        new THREE.Vector3(-.30,0,0),
        new THREE.Vector3(0,.38,0),
        new THREE.Vector3(.30,0,0)
    ],true,'centripetal');
    const loopGeom = new THREE.TubeGeometry(loopCurve,48,.052,8,true);
    topLoopMesh = new THREE.Mesh(loopGeom, ribbonMat);
    topLoopMesh.position.set(topNode.x, topNode.y + 1.72, topNode.z);
    ribbonGroup.add(topLoopMesh);
    const knotMaterial = new THREE.MeshStandardMaterial({color:0xffc62f,metalness:.8,roughness:.18});
    knotMaterial.userData.paletteRole = 'accent';
    beadMaterials.push(knotMaterial);
    const knot = new THREE.Mesh(new THREE.SphereGeometry(.16, 14, 12), knotMaterial);
    knot.position.set(topNode.x, topNode.y + .24, topNode.z); ribbonGroup.add(knot);

    // 球顶挂绳：两股红金丝线交织，并从连接珠中贯穿，避免珠子或挂环悬空。
    const goldThreadMat = new THREE.MeshStandardMaterial({color:0xffc62f,metalness:.28,roughness:.38});
    goldMaterials.push(goldThreadMat);
    const addBraidedThread = (phase, material) => {
        const points = [];
        const segments = 34;
        for (let i = 0; i <= segments; i++) {
            const t = i / segments;
            const helix = t * Math.PI * 6 + phase;
            const braidRadius = Math.sin(Math.PI * t);
            points.push(new THREE.Vector3(
                topNode.x + Math.cos(helix) * .027 * braidRadius,
                topNode.y + .035 + t * 1.30,
                topNode.z + Math.sin(helix) * .022 * braidRadius
            ));
        }
        const curve = new THREE.CatmullRomCurve3(points);
        const strand = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, .018, 5, false), material);
        ribbonGroup.add(strand);
    };
    addBraidedThread(0, ribbonMat);
    addBraidedThread(Math.PI, goldThreadMat);

    const upperNodeMat = new THREE.MeshPhysicalMaterial({color:0x8f1228,roughness:.2,clearcoat:.72,clearcoatRoughness:.16});
    const upperPearlMat = new THREE.MeshPhysicalMaterial({color:0xfff4dc,roughness:.18,clearcoat:.65});
    upperNodeMat.userData.paletteRole = 'node';
    upperPearlMat.userData.paletteRole = 'pearl';
    beadMaterials.push(upperNodeMat, upperPearlMat);
    const upperBeads = [
        {y:.47,r:.085,mat:upperNodeMat},
        {y:.67,r:.066,mat:knotMaterial},
        {y:.86,r:.09,mat:upperPearlMat},
        {y:1.05,r:.068,mat:knotMaterial},
        {y:1.22,r:.082,mat:upperNodeMat},
        {y:1.34,r:.055,mat:knotMaterial}
    ];
    upperBeads.forEach(({y,r,mat}) => {
        const bead = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 12), mat);
        bead.position.set(topNode.x, topNode.y + y, topNode.z);
        ribbonGroup.add(bead);
    });
}

function buildHomeModel() {
    petalMaterials = [];
    petalSideMaterials = [];
    panelMaterials = [];
    goldMaterials = [];
    beadMaterials = [];
    tasselMaterials = [];
    ribbonMaterials = [];
    petalDirs = [];
    buildFillPanels();
    petalsGroup.clear();
    EDGES.forEach((edge, index) => {
        petalsGroup.add(createPetalMesh(NODES[edge.a], NODES[edge.b], MODEL_R, MODEL_STATE.widthFactor, MODEL_STATE.puffFactor, index));
    });
    buildPearlNodes();
    buildTassels(MODEL_STATE.tasselConfig);
    buildTopRibbon();
}

function setupLights() {
    // 屏幕前方的柔和主光负责塑造瓣面，自阴影由环境光与侧后补光托住。
    scene.add(new THREE.AmbientLight(0xfff7ed, 0.86));
    const keyLight = new THREE.DirectionalLight(0xfff7ee, 1.82);
    keyLight.position.set(0.8, 3.8, 8);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.camera.near = .5;
    keyLight.shadow.camera.far = 20;
    keyLight.shadow.camera.left = -6;
    keyLight.shadow.camera.right = 6;
    keyLight.shadow.camera.top = 6;
    keyLight.shadow.camera.bottom = -7;
    keyLight.shadow.bias = -.00035;
    keyLight.shadow.normalBias = .035;
    keyLight.shadow.radius = 4;
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x8cd8d1, 0.64);
    fillLight.position.set(-5, -2, -5);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(0xffc75c, 0.92);
    rimLight.position.set(0, 5, -8);
    scene.add(rimLight);
    const frontGlow = new THREE.PointLight(0xffe3b2, 0.42, 18);
    frontGlow.position.set(-1.8, 0.8, 6.5);
    scene.add(frontGlow);
}

let dragRot = 0;
let immersiveMode = false;
let topPetalActive = false;
let topPetalIndex = 0;
let activeThemeIndex = 0;
let lastThemePetalIndex = -1;
let themeSpin = 0;
let themeSpinTarget = 0;
let themeSpinStart = 0;
let themeTransitionStart = 0;
let themeTransitionActive = false;
let themeMidpointApplied = true;
let pendingThemeIndex = 0;
const THEME_TRANSITION_DURATION = 1500;
const CAMERA_HOME_Z = 14.55;
const CAMERA_IMMERSIVE_Z = 9.1;

function setImmersive(next) {
    immersiveMode = next;
    topPetalActive = false;
    document.body.classList.toggle('immersive', next);
    const navigator = document.getElementById('petalNavigator');
    if (navigator) navigator.classList.remove('interacting');
    if (next && autoOn) stopAuto();
    if (next) document.getElementById('btnExitImmersion').focus({preventScroll:true});
}

function initHomeModel() {
    const canvas = document.getElementById('modelCanvas');
    scene = new THREE.Scene();
    const initialCanvasWidth = canvas.clientWidth || 560;
    const initialCanvasHeight = canvas.clientHeight || 680;
    camera = new THREE.PerspectiveCamera(42, initialCanvasWidth / initialCanvasHeight, 0.1, 100);
    camera.position.set(0, 0.2, CAMERA_HOME_Z);
    camera.lookAt(0, -1.2, 0);
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(initialCanvasWidth, initialCanvasHeight, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.24;
    ballGroup = new THREE.Group();
    fillPanelsGroup = new THREE.Group();
    petalsGroup = new THREE.Group();
    tasselsGroup = new THREE.Group();
    pearlsGroup = new THREE.Group();
    ribbonGroup = new THREE.Group();
    ballGroup.add(fillPanelsGroup, petalsGroup, tasselsGroup, pearlsGroup, ribbonGroup);
    scene.add(ballGroup);
    setupLights();
    buildHomeModel();
    ballGroup.traverse((object) => {
        if (!object.isMesh) return;
        object.castShadow = true;
        object.receiveShadow = true;
    });
    let dragging = false, dragLast = 0;
    canvas.addEventListener('pointerdown', (e) => {
        if (e.pointerType !== 'mouse') return;
        dragging = true;
        dragLast = e.clientX;
        canvas.classList.add('dragging');
        canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        dragRot += (e.clientX - dragLast) * 0.4;
        dragLast = e.clientX;
    });
    const endDrag = () => { dragging = false; canvas.classList.remove('dragging'); };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('dblclick', (e) => {
        e.preventDefault();
        setImmersive(!immersiveMode);
    });
}
initHomeModel();

/* 顶部多样绣球导览：六种唯一配色，原地旋转并切换整球配色 */
const PETAL_GUIDE_LABELS = COLOR_THEMES.map((theme) => theme.name);
const petalNavigator = document.getElementById('petalNavigator');
const petalTrack = document.getElementById('petalTrack');
const petalNavLabel = document.getElementById('petalNavLabel');
const themeBlend = document.getElementById('themeBlend');
const petalStops = PETAL_GUIDE_LABELS.map((label, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'petal-stop';
    button.setAttribute('aria-label', `第 ${index + 1} 款绣球 · ${label}`);
    button.setAttribute('aria-pressed', 'false');
    button.style.setProperty('--stop-color', COLOR_THEMES[index % COLOR_THEMES.length].petals[0]);
    button.addEventListener('pointerenter', () => selectTopPetal(index));
    button.addEventListener('focus', () => {
        topPetalActive = true;
        petalNavigator.classList.add('interacting');
        selectTopPetal(index);
    });
    petalTrack.appendChild(button);
    return button;
});

function selectTopPetal(index) {
    topPetalIndex = Math.min(PETAL_GUIDE_LABELS.length - 1, Math.max(0, index));
    const themeIndex = topPetalIndex;
    petalNavLabel.textContent = `第 ${topPetalIndex + 1} 款 · ${COLOR_THEMES[themeIndex].name}`;
    if (lastThemePetalIndex !== topPetalIndex) {
        lastThemePetalIndex = topPetalIndex;
        pendingThemeIndex = themeIndex;
        themeSpinStart = themeSpin;
        themeSpinTarget = themeSpin + Math.PI * 2;
        themeTransitionStart = performance.now();
        themeTransitionActive = true;
        themeMidpointApplied = false;
        if(themeBlend){
            themeBlend.style.setProperty('--ripple-a',COLOR_THEMES[themeIndex].petals[0]);
            themeBlend.style.setProperty('--ripple-b',COLOR_THEMES[themeIndex].accent);
            themeBlend.classList.remove('playing');
            void themeBlend.offsetWidth;
            themeBlend.classList.add('playing');
        }
    }
    petalStops.forEach((stop, i) => {
        const selected = i === topPetalIndex;
        stop.classList.toggle('on', selected);
        stop.setAttribute('aria-pressed', selected ? 'true' : 'false');
    });
}

function leaveTopPetalGuide() {
    topPetalActive = false;
    lastThemePetalIndex = -1;
    petalNavigator.classList.remove('interacting');
    petalNavLabel.textContent = '滑动换球';
    petalStops.forEach((stop) => {
        stop.classList.remove('on');
        stop.setAttribute('aria-pressed', 'false');
    });
}

petalNavigator.addEventListener('pointerenter', () => {
    topPetalActive = true;
    petalNavigator.classList.add('interacting');
    if (autoOn) stopAuto();
});
petalNavigator.addEventListener('pointermove', (event) => {
    const rect = petalTrack.getBoundingClientRect();
    const ratio = Math.min(.9999, Math.max(0, (event.clientX - rect.left) / rect.width));
    selectTopPetal(Math.floor(ratio * PETAL_GUIDE_LABELS.length));
});
petalNavigator.addEventListener('pointerleave', leaveTopPetalGuide);
petalNavigator.addEventListener('focusout', (event) => {
    if (!petalNavigator.contains(event.relatedTarget)) leaveTopPetalGuide();
});

/* 右侧卡片 */
const panelEl = document.getElementById('panel');
DATA.forEach((d, i) => {
    const card = document.createElement('div');
    card.className = 'panel-card';
    const titleLines = d.title.split(/\s*·\s*/).filter(Boolean);
    card.innerHTML = `
        <a class="chapter-link" href="chapter.html?chapter=${i + 1}" aria-label="阅读第${NUM_CN[i]}章：${d.title}">
            <h2 class="font-calligraphy">${titleLines.map(line => `<span>${line}</span>`).join('')}</h2>

/* 进度点 */
const dotsEl = document.getElementById('dots');
DATA.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' on' : '');
    dotsEl.appendChild(dot);
});

const cards = [...document.querySelectorAll('.panel-card')];
const dots = [...document.querySelectorAll('.dot')];
const mobileTitle = document.getElementById('mobileTitle');
const scrollHint = document.getElementById('scrollHint');
const burst = document.getElementById('burst');
const btnAuto = document.getElementById('btnAuto');
const btnExitImmersion = document.getElementById('btnExitImmersion');
const museumNavLinks = [...document.querySelectorAll('#museumNav [data-section]')];
btnExitImmersion.addEventListener('click', () => setImmersive(false));
window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && immersiveMode) setImmersive(false);
});

/* ========== 滚动联动 ========== */
let rot = 0;
let active = 0;
let velS = 0;
let lastY = window.scrollY;
let lastT = performance.now();
let autoOn = false;
let autoStart = 0;
let autoDir = 1;

const norm360 = (a) => { a = a % 360; return a < 0 ? a + 360 : a; };
const maxScroll = () => Math.max(1, document.documentElement.scrollHeight - innerHeight);

function setPanel(idx){
    cards.forEach((c, i) => c.classList.toggle('on', i === idx));
    dots.forEach((d, i) => d.classList.toggle('on', i === idx));
    museumNavLinks.forEach((link) => link.classList.toggle('on', Number(link.dataset.section) === idx));
    mobileTitle.textContent = `第${NUM_CN[idx]}章 · ${DATA[idx].title}`;
    scrollHint.classList.toggle('show', idx === 0);
    burst.classList.toggle('show', idx === 7);
}

function updateThemeColors() {
    const palette = COLOR_THEMES[activeThemeIndex].colors;
    const ease = themeTransitionActive ? .22 : .055;
    petalMaterials.forEach((material, index) => {
        if(material.userData.embroideryThemeIndex !== activeThemeIndex){
            const themePetalColor = COLOR_THEMES[activeThemeIndex].petals[index % COLOR_THEMES[activeThemeIndex].petals.length];
            const themeBaseColor = makeVividColor(themePetalColor,1.34).getStyle();
            const embroidery = generateReferenceEmbroideryTexture(material.userData.motif,material.userData.petalIndex,themeBaseColor);
            if(material.userData.embroideryMap) material.userData.embroideryMap.dispose();
            if(material.userData.embroideryBumpMap) material.userData.embroideryBumpMap.dispose();
            material.userData.embroideryThemeIndex = activeThemeIndex;
            material.userData.embroideryMap = embroidery.map;
            material.userData.embroideryBumpMap = embroidery.bumpMap;
            material.map = embroidery.map;
            material.bumpMap = embroidery.bumpMap;
            material.needsUpdate = true;
        }
        material.color.lerp(material.userData.previewColor, ease);
        material.bumpScale += (.075 - material.bumpScale) * .12;
        material.roughness += (.58 - material.roughness) * .1;
        material.clearcoat += (.08 - material.clearcoat) * .1;
        material.clearcoatRoughness += (.62 - material.clearcoatRoughness) * .1;
    });
    petalSideMaterials.forEach((material) => material.color.lerp(palette.petalSides[material.userData.paletteSlot % palette.petalSides.length], ease));
    panelMaterials.forEach((material) => material.color.lerp(palette.panels[material.userData.paletteSlot % palette.panels.length], ease));
    goldMaterials.forEach((material) => material.color.lerp(palette.accent, ease));
    beadMaterials.forEach((material) => {
        const target = material.userData.paletteRole === 'pearl' ? palette.pearl : material.userData.paletteRole === 'node' ? palette.node : palette.accent;
        material.color.lerp(target,ease);
    });
    tasselMaterials.forEach((material) => material.color.lerp(palette.tassels[material.userData.paletteSlot % palette.tassels.length], ease));
    ribbonMaterials.forEach((material) => material.color.lerp(palette.ribbon, ease));
}

function tick(now){
    requestAnimationFrame(tick);
    const max = maxScroll();
    const p = Math.min(1, Math.max(0, window.scrollY / max));
    const target = p * 360;
    rot += (target - rot) * 0.16;
    if (Math.abs(target - rot) < 0.02) rot = target;

    // 360° 是长卷终点，章节索引应停在第八章，不能归一化回 0°。
    const chapterRotation = Math.min(359.999, Math.max(0, rot));
    const idx = Math.min(7, Math.floor(chapterRotation / 45));
    if (idx !== active){ active = idx; setPanel(idx); }

    const totalDeg = rot + dragRot;
    const rad = totalDeg * Math.PI / 180;
    if(themeTransitionActive){
        const transitionProgress = Math.min(1,Math.max(0,(now-themeTransitionStart)/THEME_TRANSITION_DURATION));
        if(!themeMidpointApplied && transitionProgress >= .5){
            activeThemeIndex = pendingThemeIndex;
            themeMidpointApplied = true;
        }
        // 五次缓入缓出制造明显的“慢—快—慢”顿挫节奏。
        const easedSpin = transitionProgress < .5
            ? 16 * Math.pow(transitionProgress,5)
            : 1 - Math.pow(-2 * transitionProgress + 2,5) / 2;
        themeSpin = themeSpinStart + (themeSpinTarget-themeSpinStart) * easedSpin;
        if(transitionProgress >= 1){
            activeThemeIndex = pendingThemeIndex;
            themeMidpointApplied = true;
            themeTransitionActive = false;
            themeSpin = themeSpinTarget;
        }
    }
    updateThemeColors();
    if (ballGroup) {
        const baseQuaternion = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, rad, 0));
        ballGroup.quaternion.copy(baseQuaternion);
        ballGroup.rotateY(themeSpin);

        petalMaterials.forEach((material) => {
            material.emissive.setHex(0x000000);
            material.emissiveIntensity = 0;
        });
    }

    if (camera) {
        const cameraTarget = immersiveMode ? CAMERA_IMMERSIVE_Z : CAMERA_HOME_Z;
        camera.position.z += (cameraTarget - camera.position.z) * 0.08;
        camera.lookAt(0, -1.0, 0);
    }

    const glow = document.getElementById('glow');
    if (glow) glow.style.opacity = (0.55 + 0.22 * Math.sin(now * 0.0022)).toFixed(2);

    const dt = Math.max(16, now - lastT);
    const v = (window.scrollY - lastY) / dt;
    velS += (v - velS) * 0.08;
    lastY = window.scrollY; lastT = now;

    // 每束丝线以尖帽为固定根点作阻尼摆动：滚动带来惯性，停止后在重力下回到垂直方向。
    const frameScale = Math.min(2, dt / 16.67);
    const inertialLean = THREE.MathUtils.clamp(-velS * .055, -.18, .18);
    tasselDynamics.forEach((dynamic) => {
        const breeze = Math.sin(now * .00135 + dynamic.phase) * .012;
        const targetLean = inertialLean * dynamic.weight + breeze;
        dynamic.velocity += (targetLean - dynamic.angle) * .052 * frameScale;
        dynamic.velocity *= Math.pow(.87, frameScale);
        dynamic.angle += dynamic.velocity * frameScale;
        dynamic.root.rotation.z = dynamic.angle;
        dynamic.root.rotation.x = Math.sin(now * .0011 + dynamic.phase * 1.7) * .008;
    });
    if (tasselsGroup) tasselsGroup.rotation.z = 0;

    if (renderer) {
        const canvas = renderer.domElement;
        const cw = canvas.clientWidth || 560, ch = canvas.clientHeight || 560;
        const pr = renderer.getPixelRatio();
        if (canvas.width !== Math.floor(cw * pr) || canvas.height !== Math.floor(ch * pr)) {
            renderer.setSize(cw, ch, false);
            camera.aspect = cw / ch;
            camera.updateProjectionMatrix();
        }
        renderer.render(scene, camera);
    }
}

/* 自动演示（26s 上行 + 26s 下行，用户滚动即停） */
function startAuto(){
    autoOn = true; autoStart = performance.now(); autoDir = 1;
    btnAuto.innerHTML = '<svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg><span>停止</span>';
}
function stopAuto(){
    autoOn = false;
    btnAuto.innerHTML = '<svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span>自动演示</span>';
}
function autoStep(now){
    if (!autoOn) return;
    const t = (now - autoStart) / 1000;
    const period = 26;
    let e = (t % (period * 2)) / period;
    if (e > 1) e = 2 - e;
    e = e * e * (3 - 2 * e);
    window.scrollTo(0, e * maxScroll());
    requestAnimationFrame(autoStep);
}
btnAuto.addEventListener('click', () => autoOn ? stopAuto() : (startAuto(), requestAnimationFrame(autoStep)));
document.getElementById('btnTop').addEventListener('click', () => window.scrollTo({top: 0, behavior: 'smooth'}));
museumNavLinks.forEach((link) => {
    link.addEventListener('click', (event) => {
        event.preventDefault();
        const section = Number(link.dataset.section);
        window.scrollTo({top: (section / (DATA.length - 1)) * maxScroll(), behavior: 'smooth'});
    });
});
window.addEventListener('wheel', () => { if (autoOn) stopAuto(); }, {passive: true});
window.addEventListener('touchstart', () => { if (autoOn) stopAuto(); }, {passive: true});

/* 截图 / 直达参数：?sec=3 */
window.addEventListener('load', () => {
    requestAnimationFrame(tick);
    setPanel(0);
    requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('anim')));
    const secQ = parseInt(new URLSearchParams(location.search).get('sec') || '', 10);
    const secH = parseInt((location.hash.match(/sec=(\d+)/) || [])[1] || '', 10);
    const sec = !isNaN(secQ) ? secQ : secH;
    if (!isNaN(sec)) setTimeout(() => window.scrollTo(0, (Math.min(7, Math.max(0, sec)) / 8) * maxScroll()), 80);
});
